<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{NAME}} - Cover Letter</title>
<style>
  @font-face {
    font-family: 'Space Grotesk';
    src: url('../../fonts/space-grotesk-latin.woff2') format('woff2');
    font-weight: 300 700; font-style: normal;
  }
  @font-face {
    font-family: 'DM Sans';
    src: url('../../fonts/dm-sans-latin.woff2') format('woff2');
    font-weight: 100 1000; font-style: normal;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body {
    font-family: 'DM Sans', sans-serif;
    font-size: 11.5px; line-height: 1.65; color: #1a1a2e; background: #fff;
  }
  .page { max-width: 8.5in; margin: 0 auto; padding: 2px 0; }
  .header { margin-bottom: 18px; }
  .header h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 26px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 6px;
  }
  .header-gradient {
    height: 2px; border-radius: 1px; margin-bottom: 10px;
    background: linear-gradient(to right, hsl(187, 74%, 32%), hsl(270, 70%, 45%));
  }
  .contact-row { font-size: 10.5px; color: #555; }
  .contact-row .separator { color: #ccc; padding: 0 6px; }
  .meta { margin: 22px 0 18px 0; font-size: 11px; color: #444; }
  .meta .date { margin-bottom: 14px; }
  .meta .recipient { white-space: pre-line; }
  .re-line { font-weight: 600; font-size: 11.5px; margin-bottom: 16px; color: #1a1a2e; }
  .body p { margin-bottom: 12px; color: #2f2f2f; }
  .signoff { margin-top: 18px; }
  .signoff .name { font-weight: 600; margin-top: 22px; }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <h1>{{NAME}}</h1>
    <div class="header-gradient"></div>
    <div class="contact-row">{{CONTACT}}</div>
  </div>
  <div class="meta">
    <div class="date">{{DATE}}</div>
    <div class="recipient">{{RECIPIENT}}</div>
  </div>
  <div class="re-line">Re: {{RE_LINE}}</div>
  <div class="body">
    {{BODY}}
  </div>
  <div class="signoff">
    <p>Sincerely,</p>
    <div class="name">{{NAME}}</div>
  </div>
</div>
</body>
</html>
