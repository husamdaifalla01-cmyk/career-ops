<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{NAME}} - CV</title>
<style>
  /* Design matched to Husam's canonical CV PDF (blue/Word-style) */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  :root { --blue: #2e75b6; --ink: #1f1f1f; --body: #333; --muted: #6a6a6a; --rule: #d9d9d9; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 10.5px; line-height: 1.45; color: var(--body); background: #fff;
  }
  .page { max-width: 8.5in; margin: 0 auto; }

  /* Header */
  .header h1 { font-size: 26px; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; margin-bottom: 4px; }
  .tagline { color: var(--blue); font-size: 11px; margin-bottom: 3px; }
  .tagline .sep { color: var(--blue); padding: 0 5px; }
  .contact { color: #555; font-size: 10.5px; margin-bottom: 6px; }
  .contact .sep { color: #999; padding: 0 5px; }
  .header-rule { border-bottom: 2.5px solid var(--rule); position: relative; margin-bottom: 14px; }
  .header-rule::before { content: ''; position: absolute; left: 0; bottom: -2.5px; width: 64px; border-bottom: 2.5px solid var(--blue); }

  /* Sections */
  .section { margin-bottom: 13px; }
  .section-title {
    color: var(--blue); font-size: 10.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.12em;
    border-bottom: 1px solid var(--rule); padding-bottom: 3px; margin-bottom: 8px;
  }
  .summary { color: var(--body); line-height: 1.55; }

  /* Core skills: labeled category lines */
  .skill-line { margin-bottom: 4px; line-height: 1.5; }
  .skill-line b { color: var(--ink); font-weight: 700; }
  .skill-line .dot { color: var(--muted); padding: 0 4px; }

  /* Experience */
  .job { margin-bottom: 11px; break-inside: avoid; page-break-inside: avoid; }
  .job-header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .job-title { font-size: 11.5px; font-weight: 700; color: var(--ink); }
  .job-period { font-size: 10px; color: #777; white-space: nowrap; }
  .job-company { color: var(--blue); font-size: 10.5px; margin-bottom: 3px; }
  .job-company .loc { color: #888; }
  .job-company .note { color: #888; font-style: italic; }
  .job ul { padding-left: 16px; margin-top: 2px; }
  .job li { margin-bottom: 2.5px; line-height: 1.5; }

  /* Education + Languages two-column block */
  .bottom-grid { display: flex; gap: 36px; }
  .bottom-grid .col-left { flex: 1.7; }
  .bottom-grid .col-right { flex: 1; }
  .edu-item { margin-bottom: 8px; }
  .edu-header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .edu-title { font-weight: 700; color: var(--ink); font-size: 11px; }
  .edu-org { color: var(--blue); font-size: 10.5px; margin-bottom: 2px; }
  .edu-year { font-size: 10px; color: #777; white-space: nowrap; }
  .edu-item ul { padding-left: 16px; margin-top: 2px; }
  .edu-item li { margin-bottom: 2px; line-height: 1.45; }
  .lang-line { margin-bottom: 3px; }
  .lang-line b { color: var(--ink); }
  .lang-line .dot { color: var(--muted); padding: 0 4px; }

  @media print { .page { padding: 0; } }
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <h1>{{NAME}}</h1>
    <div class="tagline">{{TAGLINE}}</div>
    <div class="contact">{{CONTACT}}</div>
    <div class="header-rule"></div>
  </div>

  <div class="section">
    <div class="section-title">Professional Summary</div>
    <div class="summary">{{SUMMARY}}</div>
  </div>

  <div class="section">
    <div class="section-title">Core Skills</div>
    {{CORE_SKILLS}}
  </div>

  <div class="section">
    <div class="section-title">Professional Experience</div>
    {{EXPERIENCE}}
  </div>

  <div class="bottom-grid">
    <div class="col-left">
      <div class="section">
        <div class="section-title">Education</div>
        {{EDUCATION}}
      </div>
    </div>
    <div class="col-right">
      <div class="section">
        <div class="section-title">Languages</div>
        {{LANGUAGES}}
      </div>
    </div>
  </div>

</div>
</body>
</html>
